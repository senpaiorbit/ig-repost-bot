services:
  - type: web
    name: ig-repost
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: IG_USERNAME
        sync: false
      - key: IG_PASSWORD
        sync: false
      - key: IG_TOTP_SEED
        sync: false
      - key: IG_SESSIONID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: COMMENT_TEXT
        sync: false
      - key: COMMENT_ENABLED
        sync: false
      - key: COVER_IMAGE_URL
        sync: false
      - key: THUMBNAIL_URL
        sync: false
      - key: COVER_IMAGE_URLS
        sync: false
      - key: SESSION_FILE
        sync: false
      - key: MAX_UPLOADS_PER_DAY
        sync: false
      - key: IG_PROXY
        sync: false
      - key: AUTO_FEED_LIMIT
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: TOTP_PROVIDER_URL
        sync: false
      - key: SOURCE_USERNAMES
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
        sync: false
