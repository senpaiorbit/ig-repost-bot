services:
  - type: web
    name: ig-repost-bot
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_PER_DAY
        value: 10
      - key: FETCH_COUNT
        value: 30
      - key: PYTHON_VERSION
        value: 3.11.0
